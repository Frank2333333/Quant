<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A 股均线回踩筛选器</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "Microsoft YaHei", system-ui, sans-serif; color: #182230; background: #f5f7fb; }
    body { margin: 0; } main { max-width: 1240px; margin: 0 auto; padding: 36px 20px 56px; }
    h1 { margin: 0 0 8px; font-size: clamp(25px, 4vw, 36px); } .sub { color: #667085; margin: 0 0 22px; line-height: 1.6; }
    .toolbar, .rules { background: white; border: 1px solid #e4e7ec; border-radius: 12px; padding: 16px; box-shadow: 0 1px 2px #1018280d; }
    .toolbar { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; } button { border: 0; background: #155eef; color: white; padding: 10px 16px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; } button:disabled { opacity: .6; cursor: wait; }
    .rules { margin-top: 16px; color: #475467; line-height: 1.7; } .rules strong { color: #182230; } #status { color: #475467; } #status.error { color: #b42318; }
    .table-wrap { overflow-x: auto; background: white; margin-top: 16px; border: 1px solid #e4e7ec; border-radius: 12px; } table { border-collapse: collapse; width: 100%; min-width: 920px; font-variant-numeric: tabular-nums; } th, td { text-align: right; padding: 12px 14px; border-bottom: 1px solid #eaecf0; white-space: nowrap; } th { color: #475467; font-size: 13px; background: #fcfcfd; } td:first-child, th:first-child, td:nth-child(2), th:nth-child(2), td:nth-child(3), th:nth-child(3) { text-align: left; } tbody tr:hover { background: #f9fafb; } .empty { text-align: center !important; color: #667085; padding: 32px; }
    footer { color: #98a2b3; margin-top: 14px; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>A 股均线回踩筛选器</h1>
    <p class="sub">数据源：TradingView 中国市场延时行情（通常约 15 分钟延迟），仅供研究，不构成投资建议。</p>
    <section class="toolbar"><button id="refresh">立即刷新</button><span id="status">准备就绪</span></section>
    <section class="rules"><strong>筛选条件</strong><br>1. MA5 &gt; MA10 &gt; MA20 &gt; MA30 &gt; MA50<br>2. 当日最低价回踩至 MA10 上方 0–0.1%（不破 MA10）<br>3. 仅保留普通股票，自动排除基金与指数。</section>
    <div class="table-wrap"><table><thead><tr><th>代码</th><th>名称</th><th>交易所</th><th>最新价</th><th>最低价</th><th>MA5</th><th>MA10</th><th>MA20</th><th>MA30</th><th>MA50</th><th>距 MA10</th></tr></thead><tbody id="rows"><tr><td class="empty" colspan="11">点击“立即刷新”获取行情。</td></tr></tbody></table></div>
    <footer>页面每 15 分钟自动刷新一次。</footer>
  </main>
  <script>
    const refresh = document.querySelector('#refresh'), status = document.querySelector('#status'), body = document.querySelector('#rows');
    const money = new Intl.NumberFormat('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const esc = value => String(value ?? '').replace(/[&<>'"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[c]));
    function render(rows) { if (!rows.length) { body.innerHTML = '<tr><td class="empty" colspan="11">未找到符合条件的股票。</td></tr>'; return; } body.innerHTML = rows.map(r => `<tr><td>${esc(r.code)}</td><td>${esc(r.name)}</td><td>${esc(r.exchange)}</td><td>${money.format(r.price)}</td><td>${money.format(r.low)}</td><td>${money.format(r.ma5)}</td><td>${money.format(r.ma10)}</td><td>${money.format(r.ma20)}</td><td>${money.format(r.ma30)}</td><td>${money.format(r.ma50)}</td><td>${r.distance.toFixed(2)}%</td></tr>`).join(''); }
    async function load() { refresh.disabled = true; status.className = ''; status.textContent = '正在获取 A 股行情…'; try { const res = await fetch('/api/screen'); const data = await res.json(); if (!res.ok) throw new Error(data.error); render(data.rows); status.textContent = `检测完成：共找到 ${data.rows.length} 只符合条件的 A 股。更新时间：${new Date(data.updatedAt).toLocaleString('zh-CN')}`; } catch (err) { status.className = 'error'; status.textContent = `获取失败：${err.message || '请稍后重试。'}`; } finally { refresh.disabled = false; } }
    refresh.addEventListener('click', load); load(); setInterval(load, 15 * 60 * 1000);
  </script>
</body>
</html>
